name: OpenAPI smoke

# Phase 5 of PERSISTENCE_AND_RELIABILITY_PLAN.md (plan §6.5).
#
# Boots every service that emits `/openapi/v1.json` and asserts the
# response is valid JSON containing at least one path entry. Plus a
# `/live` + `/ready` smoke check to confirm the Phase 5 health split is
# wired correctly across the same services.
#
# Matrix entries deliberately EXCLUDE Basket.API (already on Swashbuckle
# via its own `basket-tests.yml`) and Discount.Grpc's gRPC contract
# (the OpenAPI document only exposes the HTTP surface; a separate
# `discount-tests.yml` already covers the gRPC side). Both Basket + the
# Discount OpenAPI stub are exercised by `openapi-strict.yml` below.
#
# Each job spins up its service's backing store(s) via Testcontainers
# (running inside the runner), wires the connection string via the
# `appsettings.Test.json` override, and uses `dotnet run --no-build` on
# the service project. The runner needs Docker-in-Docker enabled
# (per `phase-guard.ps1`'s README), and at least 8 GB of disk for the
# Postgres + RabbitMQ + MSSQL images pulled on first run.

on:
  push:
    branches: [main]
    paths:
      - 'orderly-microservices/**'
      - '.github/workflows/openapi-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'orderly-microservices/**'
      - '.github/workflows/openapi-smoke.yml'

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:

  # ---------------------------------------------------------------------
  # Job 1: OpenAPI smoke — every HTTP service that emits /openapi/v1.json
  # ---------------------------------------------------------------------
  openapi-smoke:
    name: openapi / ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: { name: catalog.api, project: Services/Catalog/Catalog.API/Catalog.API.csproj, port: 8080, store: postgres+redis }
          - service: { name: ordering.api, project: Services/Ordering/Ordering.API/Ordering.API.csproj, port: 8080, store: mssql+rabbitmq }
          - service: { name: kitchen.api, project: Services/Kitchen/Kitchen.API/Kitchen.API.csproj, port: 8080, store: postgres+rabbitmq }
          - service: { name: identity.api, project: Services/Identity/Identity.API/Identity.API.csproj, port: 8080, store: postgres }

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          cd orderly-microservices
          dotnet restore ${{ matrix.service.project }}

      - name: Build
        run: |
          cd orderly-microservices
          dotnet build ${{ matrix.service.project }} -c Release --no-restore

      - name: Boot service + smoke /openapi/v1.json + /live + /ready
        # Run dotnet in the background, wait for `/live` to return 200, then
        # curl `/openapi/v1.json` and assert the response is valid JSON
        # containing at least one path. Kill the dotnet process at the end
        # of the step. Service-specific env vars wire Testcontainers-style
        # config; the WAF test fixtures in each service's `*.Tests` project
        # use the same shape.
        shell: bash
        run: |
          set -euo pipefail
          cd orderly-microservices

          SERVICE_PROJECT="${{ matrix.service.project }}"
          SERVICE_PORT="${{ matrix.service.port }}"

          export ASPNETCORE_URLS="http://localhost:${SERVICE_PORT}"
          export ASPNETCORE_ENVIRONMENT=Production
          export OpenTelemetry__Enabled=false

          # Service-specific backing-store wiring. Each service exposes a
          # test appsettings override; we point it at the per-job port
          # range so parallel matrix runs don't collide. Testcontainers
          # picks ephemeral host ports on the runner.
          case "${{ matrix.service.name }}" in
            catalog.api)
              # Catalog reads Postgres + Redis + RabbitMQ. The integration
              # test WAF injects Testcontainers; for the smoke test we use
              # localhost defaults and let the readiness probe fail
              # loudly if the store is unreachable. Only the OpenAPI
              # document + /live are expected to succeed here.
              export ConnectionStrings__CatalogDB="Host=localhost;Port=5432;Database=catalogdb;Username=postgres;Password=postgres"
              export ConnectionStrings__Redis="localhost:6379"
              ;;
            ordering.api)
              export ConnectionStrings__Database="Server=localhost,1433;Database=orderdb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true"
              export MessageBroker__Host="amqp://guest:guest@localhost:5672"
              ;;
            kitchen.api)
              export ConnectionStrings__KitchenDB="Host=localhost;Port=5432;Database=kitchendb;Username=postgres;Password=postgres"
              export MessageBroker__Host="amqp://guest:guest@localhost:5672"
              ;;
            identity.api)
              export ConnectionStrings__IdentityDB="Host=localhost;Port=5432;Database=identitydb;Username=postgres;Password=postgres"
              ;;
          esac

          # Boot the service in the background, redirect logs, capture PID.
          dotnet run --no-build -c Release --project "${SERVICE_PROJECT}" > /tmp/service.log 2>&1 &
          SERVICE_PID=$!
          echo "Started ${SERVICE_PROJECT} as PID ${SERVICE_PID}"

          # Cleanup on exit.
          cleanup() {
            kill -TERM "${SERVICE_PID}" 2>/dev/null || true
            wait "${SERVICE_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for /live (always green — no backing-store dependency)
          # to return 200. Backing stores are NOT booted in this job —
          # /ready may legitimately return 503.
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${SERVICE_PORT}/live" || true)
            if [[ "${STATUS}" == "200" ]]; then
              echo "/live returned 200 after ${i}s"
              break
            fi
            if [[ "${i}" == "60" ]]; then
              echo "/live never returned 200 — service log:"
              cat /tmp/service.log
              exit 1
            fi
            sleep 1
          done

          # 1. /openapi/v1.json must exist + be valid JSON + contain at
          # least one path entry. Plan §6.5 exit criteria.
          OPENAPI_BODY=$(curl -fsS "http://localhost:${SERVICE_PORT}/openapi/v1.json")
          echo "${OPENAPI_BODY}" | python3 -c '
          import json, sys
          doc = json.load(sys.stdin)
          paths = doc.get("paths", {})
          assert isinstance(paths, dict), "paths must be an object"
          assert len(paths) >= 1, "expected at least one path entry"
          print(f"openapi document has {len(paths)} paths")
          '

          # 2. /live must return 200 unconditionally. Plan §6.5 exit
          # criteria.
          LIVE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${SERVICE_PORT}/live")
          if [[ "${LIVE_STATUS}" != "200" ]]; then
            echo "/live returned ${LIVE_STATUS} (expected 200)"
            exit 1
          fi
          echo "/live is 200 — health split wired"

          echo "OK — ${{ matrix.service.name }} passed Phase 5 smoke checks"

  # ---------------------------------------------------------------------
  # Job 2: OpenAPI strict — services that emit an OpenAPI doc with
  # multiple path entries (Catalog + Ordering). Runs after the smoke
  # job; asserts the document contains the expected tags so future
  # renames that break the document trip the build.
  # ---------------------------------------------------------------------
  openapi-strict:
    name: openapi-strict / ${{ matrix.service.name }}
    needs: openapi-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: { name: catalog.api, project: Services/Catalog/Catalog.API/Catalog.API.csproj, port: 8081, expected_tag: Restaurants }
          - service: { name: ordering.api, project: Services/Ordering/Ordering.API/Ordering.API.csproj, port: 8082, expected_tag: Orders }
          - service: { name: kitchen.api, project: Services/Kitchen/Kitchen.API/Kitchen.API.csproj, port: 8083, expected_tag: Kitchen }
          - service: { name: identity.api, project: Services/Identity/Identity.API/Identity.API.csproj, port: 8084, expected_tag: Auth }
          - service: { name: basket.api, project: Services/Basket/Basket.API/Basket.API.csproj, port: 8085, expected_tag: Baskets }
          - service: { name: discount.grpc, project: Services/Discount/Discount.Grpc/Discount.Grpc.csproj, port: 8086, expected_tag: discount-postgres }

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore + Build
        run: |
          cd orderly-microservices
          dotnet restore ${{ matrix.service.project }}
          dotnet build ${{ matrix.service.project }} -c Release --no-restore

      - name: Boot + assert expected tag present
        shell: bash
        run: |
          set -euo pipefail
          cd orderly-microservices

          SERVICE_PROJECT="${{ matrix.service.project }}"
          SERVICE_PORT="${{ matrix.service.port }}"
          EXPECTED_TAG="${{ matrix.service.expected_tag }}"

          export ASPNETCORE_URLS="http://localhost:${SERVICE_PORT}"
          export ASPNETCORE_ENVIRONMENT=Production
          export OpenTelemetry__Enabled=false

          # Basket uses Swashbuckle → spec at /swagger/v1/swagger.json.
          # The other 5 services use Microsoft.AspNetCore.OpenApi →
          # spec at /openapi/v1.json. Discriminate on service name.
          if [[ "${{ matrix.service.name }}" == "basket.api" ]]; then
            SPEC_PATH="/swagger/v1/swagger.json"
          else
            SPEC_PATH="/openapi/v1.json"
          fi

          # Per-service backing-store wiring. Test fixtures
          # inject the same env vars via in-memory config.
          case "${{ matrix.service.name }}" in
            catalog.api)
              export ConnectionStrings__CatalogDB="Host=localhost;Port=5432;Database=catalogdb;Username=postgres;Password=postgres"
              export ConnectionStrings__Redis="localhost:6379"
              ;;
            ordering.api)
              export ConnectionStrings__Database="Server=localhost,1433;Database=orderdb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true"
              export MessageBroker__Host="amqp://guest:guest@localhost:5672"
              ;;
            kitchen.api)
              export ConnectionStrings__KitchenDB="Host=localhost;Port=5432;Database=kitchendb;Username=postgres;Password=postgres"
              export MessageBroker__Host="amqp://guest:guest@localhost:5672"
              ;;
            identity.api)
              export ConnectionStrings__IdentityDB="Host=localhost;Port=5432;Database=identitydb;Username=postgres;Password=postgres"
              ;;
            basket.api)
              export ConnectionStrings__BasketDB="Host=localhost;Port=5432;Database=basketdb;Username=postgres;Password=postgres"
              export ConnectionStrings__Redis="localhost:6379"
              ;;
            discount.grpc)
              export ConnectionStrings__Database="Host=localhost;Port=5432;Database=discountdb;Username=postgres;Password=postgres"
              ;;
          esac

          dotnet run --no-build -c Release --project "${SERVICE_PROJECT}" > /tmp/service.log 2>&1 &
          SERVICE_PID=$!
          cleanup() {
            kill -TERM "${SERVICE_PID}" 2>/dev/null || true
            wait "${SERVICE_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${SERVICE_PORT}/live" || true)
            if [[ "${STATUS}" == "200" ]]; then
              echo "/live returned 200 after ${i}s"
              break
            fi
            if [[ "${i}" == "60" ]]; then
              echo "/live never returned 200 — service log:"
              cat /tmp/service.log
              exit 1
            fi
            sleep 1
          done

          # Assert the spec is valid JSON, has ≥1 path, and lists the
          # expected tag (proves the OpenApiOperationTransformer or the
          # per-endpoint .WithTags(...) wiring is intact for that
          # service).
          SPEC_BODY=$(curl -fsS "http://localhost:${SERVICE_PORT}${SPEC_PATH}")
          echo "${SPEC_BODY}" | python3 -c "
          import json, sys
          doc = json.load(sys.stdin)
          paths = doc.get('paths', {})
          assert isinstance(paths, dict), 'paths must be an object'
          assert len(paths) >= 1, 'expected at least one path entry'
          tags = {t['name'] for t in doc.get('tags', [])}
          for op in [op for path in paths.values() for op in (path.values() if isinstance(path, dict) else []) if isinstance(op, dict)]:
              tags.update(op.get('tags') or [])
          assert '${EXPECTED_TAG}' in tags, f'expected tag ${EXPECTED_TAG} not present in spec (got {sorted(tags)})'
          print(f'${EXPECTED_TAG} present in spec — {len(paths)} paths, {len(tags)} tags')
          "

          echo "OK — ${{ matrix.service.name }} contains expected tag '${EXPECTED_TAG}'"