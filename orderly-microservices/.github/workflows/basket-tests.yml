name: Basket Tests

on:
  pull_request:
    paths:
      - 'orderly-microservices/Services/Basket/**'
      - 'orderly-microservices/BuildingBlocks/**'
      - 'orderly-microservices/.github/workflows/basket-tests.yml'
  push:
    branches: [main]
    paths:
      - 'orderly-microservices/Services/Basket/**'
      - 'orderly-microservices/BuildingBlocks/**'
  workflow_dispatch:

# The Basket integration tests spin up real Postgres + Redis + RabbitMQ
# containers via Testcontainers. Concurrency is capped at one job per
# ref to avoid hammering the Docker host on a busy PR.
concurrency:
  group: basket-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: dotnet test (Basket)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Enable Docker BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-basket-nuget-${{ hashFiles('orderly-microservices/Services/Basket/Basket.API.Tests/Basket.API.Tests.csproj') }}
          restore-keys: |
            ${{ runner.os }}-basket-nuget-

      - name: Restore
        working-directory: orderly-microservices
        run: dotnet restore Services/Basket/Basket.API.Tests/Basket.API.Tests.csproj

      - name: Build
        working-directory: orderly-microservices
        run: dotnet build Services/Basket/Basket.API.Tests/Basket.API.Tests.csproj -p:TreatWarningsAsErrors=true --no-restore

      - name: Test (unit)
        working-directory: orderly-microservices
        run: dotnet test Services/Basket/Basket.API.Tests/Basket.API.Tests.csproj -p:TreatWarningsAsErrors=true --no-build --filter "FullyQualifiedName!~Integration"

      - name: Test (integration / Testcontainers)
        working-directory: orderly-microservices
        # The Testcontainers Postgres + Redis + RabbitMQ containers
        # require the runner's Docker daemon. The integration tests
        # boot a real host (Carter + MediatR + Marten + MassTransit)
        # on top of these containers and exercise the cart endpoint
        # contract via WebApplicationFactory<Program>. The suite
        # takes ~3-5 minutes wall-clock on a fresh runner; the
        # 30-minute job timeout is conservative.
        run: dotnet test Services/Basket/Basket.API.Tests/Basket.API.Tests.csproj -p:TreatWarningsAsErrors=true --no-build --filter "FullyQualifiedName~Integration"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
          DOCKER_BUILDKIT: 1
