syntax = "proto3";

option csharp_namespace = "Discount.Grpc";

package discount;

import "google/protobuf/timestamp.proto";

// Closed enum mirroring BuildingBlocks.Discounts.DiscountType. The numeric
// values are the SQLite-stored INTEGER; the proto serializer / deserializer
// pick them up automatically when this enum is referenced.
//
// NOTE: the proto3 package-scoped enum-value namespace collides with the
// existing `RewardType.PERCENTAGE` / `FIXED_AMOUNT` (Phase 3 imported the same
// names), so this enum prefixes each value with `COUPON_`. The C# side is
// named `DiscountType` (matches the existing proto-name pattern — see
// `DiscountRuleType` / `RewardType`).
enum DiscountType {
  COUPON_DISCOUNT_TYPE_UNSPECIFIED = 0;
  COUPON_PERCENTAGE = 1;
  COUPON_FIXED_AMOUNT = 2;
}

service DiscountProtoService {
  rpc GetDiscount (GetDiscountRequest) returns (GetDiscountResponse);
  rpc CreateDiscount (CreateDiscountRequest) returns (CreateDiscountResponse);
  rpc UpdateDiscount (UpdateDiscountRequest) returns (UpdateDiscountResponse);
  rpc DeleteDiscount (DeleteDiscountRequest) returns (DeleteDiscountResponse);
  rpc RedeemDiscount (RedeemDiscountRequest) returns (RedeemDiscountResponse);
  rpc ListDiscounts (ListDiscountsRequest) returns (ListDiscountsResponse);
}

service DiscountRuleProtoService {
  rpc CreateDiscountRule (CreateDiscountRuleRequest) returns (CreateDiscountRuleResponse);
  rpc GetDiscountRule (GetDiscountRuleRequest) returns (GetDiscountRuleResponse);
  rpc ListDiscountRules (ListDiscountRulesRequest) returns (ListDiscountRulesResponse);
  rpc UpdateDiscountRule (UpdateDiscountRuleRequest) returns (UpdateDiscountRuleResponse);
  rpc DeleteDiscountRule (DeleteDiscountRuleRequest) returns (DeleteDiscountRuleResponse);
  rpc EvaluateDiscountRules (EvaluateDiscountRulesRequest) returns (EvaluateDiscountRulesResponse);
}

service RewardCodeProtoService {
  rpc CreateRewardCode (CreateRewardCodeRequest) returns (CreateRewardCodeResponse);
  rpc GetRewardCode (GetRewardCodeRequest) returns (GetRewardCodeResponse);
  rpc ListRewardCodes (ListRewardCodesRequest) returns (ListRewardCodesResponse);
  rpc UpdateRewardCode (UpdateRewardCodeRequest) returns (UpdateRewardCodeResponse);
  rpc DeleteRewardCode (DeleteRewardCodeRequest) returns (DeleteRewardCodeResponse);
  rpc RedeemRewardCode (RedeemRewardCodeRequest) returns (RedeemRewardCodeResponse);
}

message CouponModel {
  int32 id = 1;
  string restaurant_id = 2;
  string code = 3;
  string description = 4;
  double amount = 5;
  int32 redeem_amount = 6;
  int32 max_redeem_amount = 7;
  string expiration_date = 8;
  bool is_active = 9;
  // Phase 8: closed discriminator governing the semantic of `amount`.
  // 0 = UNSPECIFIED, 1 = PERCENTAGE, 2 = FIXED_AMOUNT.
  // Server-side enum closed values are 1 + 2 (per §8.1 entity-side enum).
  // Pre-migration rows are re-classified as PERCENTAGE on read (audit note
  // per plan §8.1).
  DiscountType discount_type = 10;
}

message GetDiscountRequest {
  string restaurant_id = 1;
  string code = 2;
}

message GetDiscountResponse {
  CouponModel coupon = 1;
}

message CreateDiscountRequest {
  CouponModel coupon = 1;
}

message CreateDiscountResponse {
  CouponModel coupon = 1;
  bool success = 2;
}

message UpdateDiscountRequest {
  CouponModel coupon = 1;
}

message UpdateDiscountResponse {
  CouponModel coupon = 1;
  bool success = 2;
}

message DeleteDiscountRequest {
  string restaurant_id = 1;
  string code = 2;
}

message DeleteDiscountResponse {
  bool success = 1;
}

message RedeemDiscountRequest {
  string restaurant_id = 1;
  string code = 2;
}

message RedeemDiscountResponse {
  bool success = 1;
}

// Paged list of coupons for the active restaurant. Permission: `coupon:read`.
// The query path runs through the global tenant filter (no manual
// `Where(RestaurantId == ...)` in the handler). `page` is 1-based;
// `page_size` is clamped server-side to `[1, 200]` with a default of 50.
// `discount_type` field addition.
message ListDiscountsRequest {
  string restaurant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListDiscountsResponse {
  repeated CouponModel coupons = 1;
  int32 total_count = 2;
}

// ============================================================================
// DiscountRule aggregate. Permission: `discount-rule:read` for
// read/list/evaluate; `discount-rule:edit` for CUD.
// `RuleDataJson` is kept as a JSON-encoded payload keyed by RuleType so
// future rule shapes land without a proto-bump. FluentValidation enforces
// the shape at the handler boundary.
// ============================================================================

message DiscountRuleModel {
  int32 id = 1;
  string restaurant_id = 2;
  int32 coupon_id = 3;
  DiscountRuleType rule_type = 4;
  string rule_data_json = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_modified_at = 8;
}

enum DiscountRuleType {
  DISCOUNT_RULE_TYPE_UNSPECIFIED = 0;
  MIN_ORDER_AMOUNT = 1;
  REQUIRED_MENU_ITEMS = 2;
  TIME_WINDOW = 3;
  BOGO = 4;
}

message CreateDiscountRuleRequest {
  DiscountRuleModel rule = 1;
}

message CreateDiscountRuleResponse {
  DiscountRuleModel rule = 1;
  bool success = 2;
}

message GetDiscountRuleRequest {
  int32 rule_id = 1;
  string restaurant_id = 2;
}

message GetDiscountRuleResponse {
  DiscountRuleModel rule = 1;
}

message ListDiscountRulesRequest {
  string restaurant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListDiscountRulesResponse {
  repeated DiscountRuleModel rules = 1;
  int32 total_count = 2;
}

message UpdateDiscountRuleRequest {
  DiscountRuleModel rule = 1;
}

message UpdateDiscountRuleResponse {
  DiscountRuleModel rule = 1;
  bool success = 2;
}

message DeleteDiscountRuleRequest {
  int32 rule_id = 1;
  string restaurant_id = 2;
}

message DeleteDiscountRuleResponse {
  bool success = 1;
}

message EvaluateDiscountRulesRequest {
  string restaurant_id = 1;
  double order_total = 2;
  repeated string menu_item_ids = 3;
}

message EvaluateDiscountRulesResponse {
  repeated int32 applicable_coupon_ids = 1;
}

// ============================================================================
// RewardCode aggregate. Permission: `reward-code:read` for
// read/list; `reward-code:edit` for CUD; `reward-code:redeem` for redeem.
// `kind` (proto RewardType) discriminates `value`'s semantic shape;
// FluentValidation enforces the kind-specific contract at the handler
// boundary (plan §0.3.3). FreeItem rewards carry the target menu-item id
// in `description` as `free-item:{menuItemId}` (proto v1 stays simple;
// v2 bumps `RewardTargetMenuItemId` per plan §0.4.3).
//
// Proto enum naming follows the DiscountRuleType / DiscountRuleKind
// precedent: the wire-format enum is `RewardType` (distinct from the
// entity-side `RewardKind` enum in `Discount.Grpc.Models`) so the two
// namespaces don't collide and the cross-cast is explicit.
// ============================================================================

message RewardCodeModel {
  int32 id = 1;
  string restaurant_id = 2;
  string code = 3;
  RewardType kind = 4;
  double value = 5;
  string description = 6;
  string expiration_date = 7;
  int32 redeem_amount = 8;
  int32 max_redeem_amount = 9;
  string redeemed_in_order_id = 10;
  string redeemed_at = 11;
  bool is_active = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp last_modified_at = 14;
}

enum RewardType {
  REWARD_TYPE_UNSPECIFIED = 0;
  PERCENTAGE = 1;
  FIXED_AMOUNT = 2;
  FREE_ITEM = 3;
  POINTS = 4;
}

message CreateRewardCodeRequest {
  RewardCodeModel reward_code = 1;
}

message CreateRewardCodeResponse {
  RewardCodeModel reward_code = 1;
  bool success = 2;
}

message GetRewardCodeRequest {
  int32 reward_code_id = 1;
  string restaurant_id = 2;
}

message GetRewardCodeResponse {
  RewardCodeModel reward_code = 1;
}

// Paged list of reward codes for the active restaurant. Permission:
// `reward-code:read`. `page` is 1-based; `page_size` clamped to `[1, 200]`
// with a default of 50 — same shape as ListDiscounts / ListDiscountRules.
message ListRewardCodesRequest {
  string restaurant_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListRewardCodesResponse {
  repeated RewardCodeModel reward_codes = 1;
  int32 total_count = 2;
}

message UpdateRewardCodeRequest {
  RewardCodeModel reward_code = 1;
}

message UpdateRewardCodeResponse {
  RewardCodeModel reward_code = 1;
  bool success = 2;
}

message DeleteRewardCodeRequest {
  int32 reward_code_id = 1;
  string restaurant_id = 2;
}

message DeleteRewardCodeResponse {
  bool success = 1;
}

// `restaurant_id` is double-checked against ICurrentRestaurantProvider;
// mismatch returns `StatusCode.PermissionDenied` with
// `Metadata["tenant-mismatch"] = "true"`. `Quantity` defaults to 1;
// FreeItem rewards require Quantity == 1 (plan §0.3.3).
message RedeemRewardCodeRequest {
  string restaurant_id = 1;
  int32 reward_code_id = 2;
  string order_id = 3;
  int32 quantity = 4;
}

message RedeemRewardCodeResponse {
  RewardCodeModel reward_code = 1;
  bool success = 2;
}
