services:
  catalogdb:
    container_name: catalogdb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=Catalogdb
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data

  basketdb:
    container_name: basketdb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=Basketdb
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/data

  distributedcache:
    container_name: distributedcache
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redisdev}"]
    ports:
      - "6379:6379"

  orderdb:
    container_name: orderdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-YrPsswrd123456789}
    restart: unless-stopped
    ports:
      - "1433:1433"
    volumes:
      - mssql_order:/var/opt/mssql

  kitchendb:
    container_name: kitchendb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=Kitchendb
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    ports:
      - "5436:5432"
    volumes:
      - postgres_kitchen:/var/lib/postgresql/data

  messagebroker:
    container_name: messagebroker
    hostname: orderly-mq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}

  catalog.api:
    container_name: catalog.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      - ConnectionStrings__CatalogDB=Server=catalogdb;Port=5432;Database=Catalogdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};IncludeErrorDetail=true
      - ConnectionStrings__Redis=distributedcache:6379,password=${REDIS_PASSWORD:-redisdev}
      - IdentityServiceUrl=http://identity.api:8080
      - FeatureManagement__CatalogRedisCache=true
      - Catalog__CacheRepairIntervalMinutes=5
      - Catalog__MenuCacheTtlMinutes=60
      - Catalog__IngredientCacheTtlMinutes=5
      - Catalog__OutboxDeadLetterThreshold=0
      - MessageBroker__Host=amqp://messagebroker:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
    ports:
      - "6000:8080"
      - "6060:8081"
    depends_on:
      catalogdb:
        condition: service_healthy
      distributedcache:
        condition: service_healthy
      identity.api:
        condition: service_started
      messagebroker:
        condition: service_healthy
    volumes:
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/root/.aspnet/https:ro
  basket.api:
    container_name: basket.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      # Phase 4: point the OTLP exporter at the in-compose
      # otel-collector container.
      - OpenTelemetry__Endpoint=http://otel-collector:4317
      - OpenTelemetry__OtlpProtocol=Grpc
      - ConnectionStrings__BasketDB=Server=basketdb;Port=5432;Database=Basketdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};IncludeErrorDetail=true
      - ConnectionStrings__Redis=distributedcache:6379,password=${REDIS_PASSWORD:-redisdev}
      - GrpcSettings__DiscountUrl=https://discount.grpc:8081
      - IdentityServiceUrl=http://identity.api:8080
      - MessageBroker__Host=amqp://messagebroker:5672
      - MessageBroker__UserName=${RABBITMQ_DEFAULT_USER:-guest}
      - MessageBroker__Password=${RABBITMQ_DEFAULT_PASS:-guest}
    depends_on:
      basketdb:
        condition: service_healthy
      distributedcache:
        condition: service_healthy
      discount.grpc:
        condition: service_started
      identity.api:
        condition: service_started
      messagebroker:
        condition: service_healthy
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/root/.aspnet/https:ro

  discountdb:
    container_name: discountdb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=Discountdb
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    ports:
      - "5437:5432"
    volumes:
      - discount-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d Discountdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  discount.grpc:
    container_name: discount.grpc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      # Phase 4: point the OTLP exporter at the in-compose
      # otel-collector container.
      - OpenTelemetry__Endpoint=http://otel-collector:4317
      - OpenTelemetry__OtlpProtocol=Grpc
      - ConnectionStrings__Database=Server=discountdb;Port=5432;Database=Discountdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};IncludeErrorDetail=true
    ports:
      - "6002:8080"
      - "6062:8081"
    depends_on:
      discountdb:
        condition: service_healthy
    volumes:
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/root/.aspnet/https:ro

  identitydb:
    container_name: identitydb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=Identitydb
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    ports:
      - "5435:5432"
    volumes:
      - postgres_identity:/var/lib/postgresql/data

  identity.api:
    container_name: identity.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      # Phase 4: point the OTLP exporter at the in-compose
      # otel-collector container.
      - OpenTelemetry__Endpoint=http://otel-collector:4317
      - OpenTelemetry__OtlpProtocol=Grpc
      - ConnectionStrings__IdentityDB=Server=identitydb;Port=5432;Database=Identitydb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};IncludeErrorDetail=true
      # Default OpenIddict cert paths point at the mounted /root/.aspnet/https
      # volume. The volume is mounted writable (no :ro) so the dev signing
      # certificate survives container restarts — see Phase 2 of
      # TRUST_ROOT_HARDENING_PLAN.md. In a production deploy, override these
      # with paths to real PEM/PFX files.
      - OpenIddict__SigningCertificatePath=/root/.aspnet/https/aspnetapp.pfx
      - OpenIddict__SigningCertificatePassword=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
      - OpenIddict__EncryptionCertificatePath=/root/.aspnet/https/aspnetapp.pfx
      - OpenIddict__EncryptionCertificatePassword=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
    ports:
      - "6007:8080"
      - "6067:8081"
    depends_on:
      identitydb:
        condition: service_healthy
    volumes:
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/home/app/.aspnet/https:ro
      # Writable (no :ro) so the dev OpenIddict signing/encryption cert
      # persisted by AddDevelopmentSigningCertificate() survives container
      # restarts. Without this, every restart regenerates the cert and breaks
      # downstream JWKS caches (15-minute default rotation).
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/root/.aspnet/https

  ordering.api:
    container_name: ordering.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      # Phase 4: point the OTLP exporter at the in-compose
      # otel-collector container.
      - OpenTelemetry__Endpoint=http://otel-collector:4317
      - OpenTelemetry__OtlpProtocol=Grpc
      - ConnectionStrings__Database=Server=orderdb;Database=OrderDb;User ID=sa;Password=${SA_PASSWORD:-YrPsswrd123456789};Encrypt=False;TrustServerCertificate=True
      - MessageBroker__Host=amqp://messagebroker:5672
      - MessageBroker__UserName=${RABBITMQ_DEFAULT_USER:-guest}
      - MessageBroker__Password=${RABBITMQ_DEFAULT_PASS:-guest}
      - IdentityServiceUrl=http://identity.api:8080
      - FeatureManagement__OrderFullfilment=true
    ports:
      - "6003:8080"
      - "6063:8081"
    depends_on:
      identity.api:
        condition: service_started
      orderdb:
        condition: service_healthy
      messagebroker:
        condition: service_healthy
    volumes:
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/root/.aspnet/https:ro

  kitchen.api:
    container_name: kitchen.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      # Phase 4: point the OTLP exporter at the in-compose
      # otel-collector container.
      - OpenTelemetry__Endpoint=http://otel-collector:4317
      - OpenTelemetry__OtlpProtocol=Grpc
      - ConnectionStrings__KitchenDB=Server=kitchendb;Port=5432;Database=Kitchendb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};IncludeErrorDetail=true
      - IdentityServiceUrl=http://identity.api:8080
      # Phase 2: kitchen.api was missing MessageBroker__Host / UserName /
      # Password — Kitchen.API crashed on startup with
      # ArgumentNullException at BuildingBlocks.Messaging/MassTransit/
      # Extensions.cs:19 because AddMessageBroker found a missing key.
      # Now defensive (BrokerConfigurationException names every absent
      # key) but still needs the values supplied here.
      - MessageBroker__Host=amqp://messagebroker:5672
      - MessageBroker__UserName=${RABBITMQ_DEFAULT_USER:-guest}
      - MessageBroker__Password=${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "6005:8080"
      - "6065:8081"
    depends_on:
      kitchendb:
        condition: service_healthy
      identity.api:
        condition: service_started
      messagebroker:
        condition: service_healthy
    volumes:
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/root/.aspnet/https:ro

  yarpapigateway:
    container_name: yarpapigateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_Kestrel__Certificates__Default__Password:-password123}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/home/app/.aspnet/https/aspnetapp.pfx
      # Phase 4: point the OTLP exporter at the in-compose
      # otel-collector container.
      - OpenTelemetry__Endpoint=http://otel-collector:4317
      - OpenTelemetry__OtlpProtocol=Grpc
    ports:
      - "6004:8080"
      - "6064:8081"
    depends_on:
      catalog.api:
        condition: service_started
      basket.api:
        condition: service_started
      discount.grpc:
        condition: service_started
      ordering.api:
        condition: service_started
      kitchen.api:
        condition: service_started
      identity.api:
        condition: service_started
    volumes:
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${XDG_DATA_HOME:-${APPDATA:-~/.local/share}}/ASP.NET/Https:/root/.aspnet/https:ro
