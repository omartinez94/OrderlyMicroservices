# docker-compose.yml is now the production-shaped base file.
# Every backing-store container carries a healthcheck block (so
# `condition: service_healthy` can wait for readiness before dependent
# services start) and every service depends_on block uses the
# condition-keyed form (no more plain-list dependencies). The dev
# defaults (ASPNETCORE_ENVIRONMENT=Development, default passwords,
# volume mounts) live in docker-compose.override.dev.yml; the
# production-shaped overrides (ASPNETCORE_ENVIRONMENT=Production, no
# dev defaults) live in docker-compose.override.prod.yml. The base file
# deliberately omits ASPNETCORE_ENVIRONMENT so production deploys
# default to `${ASPNETCORE_ENVIRONMENT:-Production}`.

services:
  catalogdb:
    # Phase 4 (DOCKER_BUILD_PERFORMANCE_PLAN): pinned to a specific patch
    # tag (postgres:16-alpine3.20) instead of the floating 16-alpine alias.
    # Same major.minor; locks the cache key so cached layers survive
    # upstream alpine-base bumps.
    image: postgres:16-alpine3.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d Catalogdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  basketdb:
    image: postgres:16-alpine3.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d Basketdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  distributedcache:
    # Pinned redis:7.4-alpine3.20 (was floating 7-alpine).
    image: redis:7.4-alpine3.20
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  orderdb:
    # Phase 4 (DOCKER_BUILD_PERFORMANCE_PLAN): azure-sql-edge replaces
    # mssql/server:2022-latest for dev. azure-sql-edge pulls ~1.5 GB vs
    # ~4 GB for mssql/server and cold-starts in ~20-30 s vs 60-90 s.
    # SQL Server wire protocol is compatible with the .NET SqlClient /
    # EF Core provider used by Ordering.API. Acceptance criterion
    # (plan §6.4): cold-start ≤ 90 s. Azure SQL Edge carries a smaller
    # feature surface — see plan §10.1 "Azure SQL Edge feature parity"
    # and Phase 4 implementation notes for the audit.
    image: mcr.microsoft.com/azure-sql-edge:latest
    healthcheck:
      # sqlcmd against SELECT 1. Azure SQL Edge ships mssql-tools under
      # /opt/mssql-tools/bin (no /opt/mssql-tools18 variant on Edge); the
      # wildcard still matches.
      test:
        - "CMD-SHELL"
        - '/opt/mssql-tools*/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 20
      # Phase 4: shorter start_period — azure-sql-edge cold-start is ~20-30 s,
      # the previous 60s was tuned for mssql/server's 60-90 s cold-init window.
      start_period: 30s

  kitchendb:
    image: postgres:16-alpine3.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d Kitchendb"]
      interval: 5s
      timeout: 3s
      retries: 10

  messagebroker:
    # Pinned rabbitmq:3.13-management (was floating 3-management).
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  identitydb:
    image: postgres:16-alpine3.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d Identitydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  discountdb:
    image: postgres:16-alpine3.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d Discountdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Services/Catalog/Catalog.API/Dockerfile
    depends_on:
      catalogdb:
        condition: service_healthy
      distributedcache:
        condition: service_healthy
      identity.api:
        condition: service_started
      messagebroker:
        condition: service_healthy
      # Phase 4 of DOCKER_BUILD_PERFORMANCE_PLAN: catalog.api does not query
      # kitchendb or identitydb at startup — its only data dependencies are
      # catalogdb + distributedcache; its only API dependency is identity.api
      # (HTTP). service_started is sufficient: each backing store / API is
      # expected to handle "not-yet-ready" calls (HTTP retries for APIs,
      # EF retry-on-failure for DBs). The previous service_healthy waits
      # serialized catalog.api behind unrelated services' healthchecks.
      kitchendb:
        condition: service_started
      identitydb:
        condition: service_started
    healthcheck:
      # /live (not /ready) — always 200 when the process is up; /ready
      # bounces during cold backing-store restarts and would re-create
      # the pod on Kubernetes (the bad behaviour Phase 5's split fixed).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    depends_on:
      basketdb:
        condition: service_healthy
      distributedcache:
        condition: service_healthy
      discount.grpc:
        condition: service_started
      identity.api:
        condition: service_started
      messagebroker:
        condition: service_healthy
      catalog.api:
        condition: service_started
    healthcheck:
      # /live (not /ready) — always 200 when the process is up; /ready
      # bounces during cold backing-store restarts and would re-create
      # the pod on Kubernetes (the bad behaviour Phase 5's split fixed).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile
    depends_on:
      discountdb:
        condition: service_healthy
      identity.api:
        condition: service_started
    healthcheck:
      # /live (not /ready) — always 200 when the process is up; /ready
      # bounces during cold backing-store restarts and would re-create
      # the pod on Kubernetes (the bad behaviour Phase 5's split fixed).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  identity.api:
    image: ${DOCKER_REGISTRY-}identityapi
    build:
      context: .
      dockerfile: Services/Identity/Identity.API/Dockerfile
    depends_on:
      identitydb:
        condition: service_healthy
    healthcheck:
      # /live (not /ready) — always 200 when the process is up; /ready
      # bounces during cold backing-store restarts and would re-create
      # the pod on Kubernetes (the bad behaviour Phase 5's split fixed).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      dockerfile: Services/Ordering/Ordering.API/Dockerfile
    depends_on:
      identity.api:
        condition: service_started
      orderdb:
        condition: service_healthy
      messagebroker:
        condition: service_healthy
    healthcheck:
      # /live (not /ready) — always 200 when the process is up; /ready
      # bounces during cold backing-store restarts and would re-create
      # the pod on Kubernetes (the bad behaviour Phase 5's split fixed).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  kitchen.api:
    image: ${DOCKER_REGISTRY-}kitchenapi
    build:
      context: .
      dockerfile: Services/Kitchen/Kitchen.API/Dockerfile
    depends_on:
      kitchendb:
        condition: service_healthy
      identity.api:
        condition: service_started
      messagebroker:
        condition: service_healthy
    healthcheck:
      # /live (not /ready) — always 200 when the process is up; /ready
      # bounces during cold backing-store restarts and would re-create
      # the pod on Kubernetes (the bad behaviour Phase 5's split fixed).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  yarpapigateway:
    image: ${DOCKER_REGISTRY-}yarpapigateway
    build:
      context: .
      dockerfile: ApiGateway/YarpApiGateway/Dockerfile
    depends_on:
      catalog.api:
        condition: service_started
      basket.api:
        condition: service_started
      discount.grpc:
        condition: service_started
      ordering.api:
        condition: service_started
      kitchen.api:
        condition: service_started
      identity.api:
        condition: service_started
    healthcheck:
      # /live (not /ready) — always 200 when the process is up; /ready
      # bounces during cold backing-store restarts and would re-create
      # the pod on Kubernetes (the bad behaviour Phase 5's split fixed).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Phase 4: OpenTelemetry collector. Every service exports traces,
  # metrics, and logs to the collector via the OTLP exporter pointed
  # at http://otel-collector:4317 by the `OpenTelemetry__Endpoint`
  # env var (set in docker-compose.override.dev.yml). The collector's
  # debug exporter prints every payload to stdout (visible via
  # `docker logs otel-collector`) so a single end-to-end request is
  # observable without a real backend. Set
  # `OTEL_EXPORTER_OTLP_ENDPOINT` in the host env to forward to
  # Tempo / Jaeger / Honeycomb / Datadog / etc.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    # No healthcheck: the contrib image is stripped of shell utilities
    # (no wget/curl/nc), so any HTTP probe fails with "executable file
    # not found". The collector's own runtime logs every export failure
    # at info level — `docker logs otel-collector` is the probe. No
    # service depends on otel-collector (condition: service_healthy is
    # not used), so a failed healthcheck only adds noise to
    # `docker ps --format`.

volumes:
  postgres_catalog:

  postgres_basket:

  postgres_identity:

  postgres_kitchen:

  mssql_order:

  discount-data: